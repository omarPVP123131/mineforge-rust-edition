name: mfre release
# MineForge Rust Edition: publishes one signed game release. Push a `v*` tag (v26.3.0) or run
# this by hand with a version. The build (mfre-game-build.yml) makes the Linux and Windows x64
# archives and the Linux server; `sign` hashes them and signs the list with the repository's
# RELEASE_SIGNING_KEY (base64 PKCS#8 Ed25519, tools/ci/sign_release.sh — the SHA256SUMS.sig the
# launcher verifies against crates/horizon-release-sign/release-keys.txt); `publish` checks the
# signature exactly as a launcher does, then creates the release. A `v*` release that is not a
# pre-release is the fork's Stable channel (launcher/src/nightly.rs, stable_builds).
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: The version to build and publish (the tag is v<version>)
        required: true
        default: '26.3.0'
permissions:
  contents: read
concurrency:
  group: mfre-release
  cancel-in-progress: false
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v${{ inputs.version }}"
          fi
          version="${tag#v}"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::$tag is not v<digits>[.<digits>…]"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/mfre-game-build.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.meta.outputs.version }}

  # The game release carries a copy of its build's SDK index (sdk_cache.rs: `build_of` reads
  # `<base>/<tag>/sdk.json` under the game tag's signature to learn the build id, and native
  # mods are compiled against `sdk-<build id>`). The SDK of this exact commit must already be
  # published (workflow `mfre sdk`, tag `sdk-<commit>`); this job fails the release early,
  # before anything is built twice, when it is not.
  sdk:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: crates/horizon-release-sign/release-keys.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the build's SDK index from its own signed release
        env:
          SDK_TAG: sdk-${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$SDK_TAG"
          mkdir -p sdk-dist
          for f in sdk.json SHA256SUMS SHA256SUMS.sig; do
            curl -fsSL --retry 3 -o "sdk-dist/$f" "$base/$f" || {
              echo "::error::$SDK_TAG has no $f — publish this commit's SDK first (push the tag $SDK_TAG; workflow 'mfre sdk')";
              exit 1; }
          done
      - name: Check it exactly as a launcher checks it
        env:
          SDK_TAG: sdk-${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "$SDK_TAG" <<'PY'
          import base64, hashlib, subprocess, sys, tempfile, os
          tag = sys.argv[1]
          keys = [l.strip() for l in open("crates/horizon-release-sign/release-keys.txt")
                  if l.strip() and not l.startswith("#")]
          sums = open("sdk-dist/SHA256SUMS", "rb").read()
          sigs = [l for l in open("sdk-dist/SHA256SUMS.sig").read().splitlines() if l.strip()]
          message = f"horizon release {tag}\n".encode() + sums
          with tempfile.TemporaryDirectory() as tmp:
              ok = False
              for i, key in enumerate(keys):
                  der = bytes.fromhex("302a300506032b6570032100") + base64.b64decode(key)
                  pem = os.path.join(tmp, f"key{i}.pem")
                  b64 = base64.encodebytes(der).decode().strip()
                  open(pem, "w").write("-----BEGIN PUBLIC KEY-----\n"
                      + "\n".join(b64[j:j+64] for j in range(0, len(b64), 64))
                      + "\n-----END PUBLIC KEY-----\n")
                  for j, sig in enumerate(sigs):
                      raw = os.path.join(tmp, f"sig{j}.bin")
                      open(raw, "wb").write(base64.b64decode(sig))
                      msg = os.path.join(tmp, "message")
                      open(msg, "wb").write(message)
                      r = subprocess.run(["openssl", "pkeyutl", "-verify", "-pubin",
                                          "-inkey", pem, "-rawin", "-in", msg, "-sigfile", raw],
                                         capture_output=True)
                      if r.returncode == 0:
                          ok = True
          if not ok:
              sys.exit(f"no release key verifies {tag}'s SHA256SUMS.sig")
          digest = hashlib.sha256(open("sdk-dist/sdk.json", "rb").read()).hexdigest()
          listed = [l.split() for l in sums.decode().splitlines() if l.strip()]
          if not any(len(p) == 2 and p[0] == digest and p[1] == "sdk.json" for p in listed):
              sys.exit("sdk.json's SHA-256 is not a line of the signed SHA256SUMS")
          print(f"{tag}: signature and sdk.json checksum verified")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: horizon-sdk-index
          path: sdk-dist/sdk.json
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: [meta, build, sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The key's only job: hash the archives and sign with the runner's OpenSSL, as upstream.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: horizon-*
          merge-multiple: true
      - name: Sign the checksums for this release (SHA256SUMS.sig)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          bash tools/ci/sign_release.sh "${{ needs.meta.outputs.tag }}" \
            dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip \
            dist/horizon-server-linux-x86_64.tar.gz dist/sdk.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [meta, build, sdk, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: horizon-*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist
      - name: The signature, checked as launchers check it
        run: |
          cargo run --locked --quiet -p horizon-release-sign -- verify \
            --repository "$GITHUB_REPOSITORY" --tag "${{ needs.meta.outputs.tag }}" --publishing dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          cat > notes.md <<NOTES
          MineForge Rust Edition ${version} — el juego (cliente Rust, Minecraft ${version%.*}) para
          Linux x86_64 y Windows x64, más el servidor dedicado de Linux.

          Instalación: desde el launcher (Inicio → la versión estable que aparece), que verifica
          SHA256SUMS y su firma antes de descargar. Los archivos adjuntos:

          - \`horizon-windows-x64.zip\` — el juego para Windows x64
          - \`horizon-linux-x86_64.tar.gz\` — el juego para Linux x86_64
          - \`horizon-server-linux-x86_64.tar.gz\` — el servidor dedicado (jugar con amigos)
          - \`sdk.json\` — el índice del SDK de mods de este build (mods nativos del catálogo)
          - \`SHA256SUMS\` + \`SHA256SUMS.sig\` — las sumas y su firma Ed25519
          NOTES
          gh release create "$tag" \
            dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip \
            dist/horizon-server-linux-x86_64.tar.gz dist/sdk.json \
            dist/SHA256SUMS dist/SHA256SUMS.sig \
            --title "MineForge Rust Edition ${version}" --notes-file notes.md
