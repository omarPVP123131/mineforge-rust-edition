name: mfre mods
# MineForge Rust Edition: publishes the fork's mod packages. Push a tag `mods-<game version>`
# (mods-26.3.2) or run this by hand with a version. Every `mods/mfre-*` project with a
# horizon-mod.toml is packed with the repository's own cargo-horizon-mod — the same tool a
# modder runs: a native mod fetches the signed SDK of its [native] pin from this repository's
# releases (workflow "mfre sdk" must have published `sdk-<pin>` first), `check` runs cargo
# check for the host and for wasm32 plus the package rules, and `build` packs the .hmod with
# its uses table. The release is created with --latest=false, so `releases/latest` stays a
# game release (D30), and a `mods-*` tag is no version the launcher's channels list
# (stable_builds skips what parses to no version). The catalog entry (registry/index.json and
# registry/icons/) is a follow-up commit on main: its size and SHA-256 come from the file
# this workflow published, and the browser's catalog test gates that commit locally. Dispatching with notes_only rewrites the
# notes of an existing `mods-*` release (the modder guide) without building or touching assets.
on:
  push:
    tags: ['mods-[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: The game version to publish mod packages for (the tag is mods-<version>)
        required: true
        default: '26.3.2'
      notes_only:
        description: Only rewrite the notes of the existing release (no build, no new assets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mfre-mods
  cancel-in-progress: false
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      notes_only: ${{ steps.meta.outputs.notes_only }}
    steps:
      - id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/mods-* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="mods-${{ inputs.version }}"
          fi
          version="${tag#mods-}"
          [[ "$tag" =~ ^mods-[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::$tag is not mods-<digits>[.<digits>…]"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes_only=${{ github.event_name == 'workflow_dispatch' && inputs.notes_only }}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: needs.meta.outputs.notes_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: wasm32-unknown-unknown
      - name: Install the repository's own mod tool
        run: cargo install --locked --path crates/cargo-horizon-mod
      - name: Check and pack every fork mod
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for dir in mods/mfre-*/; do
            [[ -f "$dir/horizon-mod.toml" ]] || continue
            echo "::group::${dir%/}"
            # A code mod is checked (host + wasm32 against its pinned SDK) before it is packed;
            # a content-only mod has no Cargo project, and `build` runs the content checks.
            if [[ -f "$dir/Cargo.toml" ]]; then
              ( cd "$dir" && cargo horizon-mod check )
            fi
            ( cd "$dir" && cargo horizon-mod build )
            hmod=$(find "$dir" -name '*.hmod' -path '*horizon-mod*' | head -1)
            [[ -n "$hmod" ]] || { echo "::error::${dir%/} packed no .hmod"; exit 1; }
            read -r id ver < <(python3 - "$dir" <<'PY'
          import sys, tomllib
          m = tomllib.load(open(sys.argv[1] + "/horizon-mod.toml", "rb"))
          print(m["id"], m["version"])
          PY
            )
            cp "$hmod" "dist/${id}-${ver}.hmod"
            echo "::endgroup::"
          done
          [[ -n "$(ls -A dist)" ]] || { echo "::error::no mods/mfre-* project packed"; exit 1; }
          sha256sum dist/*.hmod > sums.txt
          stat -c "%n %s B" dist/*.hmod >> sums.txt
          cat sums.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mods-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [meta, build]
    if: needs.meta.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.meta.outputs.notes_only != 'true'
        with:
          name: mods-dist
          path: dist
      - name: Publish the mod packages (or rewrite an existing release's notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          notes_only="${{ needs.meta.outputs.notes_only }}"
          if [[ "$notes_only" == "true" ]]; then
            gh release view "$tag" > /dev/null || {
              echo "::error::no existe la release $tag; corre el workflow sin notes_only para crearla"
              exit 1
            }
            mkdir -p dist
            gh release download "$tag" --pattern '*.hmod' --dir dist --clobber
          fi
          cat > notes.md <<NOTES
          Paquetes de mods de MineForge Rust Edition para el juego ${version}: los \`.hmod\`
          instalables con un clic desde el catálogo del launcher.

          ## Cómo se instala desde aquí

          La entrada del catálogo (\`registry/index.json\`, rama main) apunta al archivo de esta
          release cuyo SHA-256 y tamaño coinciden; el lector del catálogo del launcher los
          verifica antes de instalar. Los mods nativos se compilan en la máquina del jugador:
          el launcher baja el juego prebuilt, el SDK firmado de esta versión (\`sdk.json\` en la
          release \`v${version}\`; el resto en la prerelease \`sdk-<commit>\`) y, si el mod usa
          mixins, la herramienta prebuilt de la release \`mixins-tool-*\` — todo automático.

          ## Las 3 formas de hacer mods (libro: \`docs/modding/\` en main)

          1. **Contenido** — datos y recursos sin código: \`how-to/content-mods.md\`.
          2. **Wasm** — scripts sandboxeados sobre la API del motor (chat, ticks, fluidos…):
             \`cargo horizon-mod new mi-mod --template wasm\` → \`build --wasm\` → \`check\`;
             \`how-to/wasm-mods.md\`.
          3. **Nativos** — Rust contra el SDK del juego (registros de bloques/items, hooks y,
             con filas \`[[native.mixin]]\`, código dentro de las funciones internas del juego):
             \`cargo horizon-mod new mi-mod --template native\`; \`how-to/native-mods.md\` y
             \`concepts/native-route.md\`. El pin \`[native] horizon\` debe ser el commit de esta
             versión (el \`build\` de su \`sdk.json\`).

          ## Cómo llega un mod a esta release y al catálogo

          1. Escribe y prueba tu mod con \`cargo horizon-mod check\` / \`build\` (la herramienta
             instala sola el Rust del repo y baja el SDK firmado).
          2. El fork empaqueta: cada proyecto \`mods/mfre-*\` se buildea aquí con ese mismo
             \`cargo-horizon-mod\` al empujar el tag \`mods-<version>\`.
          3. La entrada de catálogo (registro + icono) es un commit en main con el SHA-256 y el
             tamaño del archivo publicado aquí; el test del reader del catálogo la valida.

          Guía del fork (toolchain, SDK, decisiones): \`MODS-MFRE.md\`. Sumas de lo publicado:

          \`\`\`
          $(cd dist && sha256sum *.hmod && stat -c "%n %s B" *.hmod)
          \`\`\`
          NOTES
          if [[ "$notes_only" == "true" ]]; then
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/*.hmod \
              --target "${{ github.sha }}" --latest=false \
              --title "Mods MFRE ${version}" --notes-file notes.md
          fi
