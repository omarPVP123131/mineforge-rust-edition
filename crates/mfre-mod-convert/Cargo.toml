[package]
name = "mfre-mod-convert"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MineForge Rust Edition (F45): a Java content mod's jar into a Horizon content mod's project, ready for `cargo horizon-mod build`"

[dependencies]
# The manifest and content rules the build and the game apply, and the icon's.
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index", "prebuilt"] }
# The jar's identity and census, read without decompiling, and the guarded zip reader.
horizon-port-pack = { path = "../horizon-port-pack" }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
base64 = "0.22"
tempfile = "3.27.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
